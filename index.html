<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門即時交通路況監控系統 (串流穩定版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Microsoft JhengHei", sans-serif; background: #1a1a1a; }
        #map { width: 100vw; height: 100vh; }
        
        .info-panel {
            position: absolute; top: 20px; left: 60px; z-index: 1000;
            background: rgba(40, 40, 40, 0.9); color: white;
            padding: 12px 20px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
            pointer-events: none;
        }
        .info-panel h2 { margin: 0 0 5px 0; font-size: 18px; color: #00d4ff; }
        .update-time { font-size: 13px; color: #bbb; display: flex; align-items: center; }
        
        .status-dot {
            height: 8px; width: 8px; background-color: #28a745;
            border-radius: 50%; display: inline-block; margin-right: 8px;
            box-shadow: 0 0 8px #28a745;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .legend {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); padding: 12px;
            border-radius: 8px; font-size: 14px; line-height: 1.8;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .leaflet-popup-content-wrapper { background: rgba(255, 255, 255, 0.95); }
    </style>
</head>
<body>

    <div class="info-panel">
        <h2>澳門即時交通監控</h2>
        <div class="update-time">
            <span class="status-dot"></span>
            最後更新時間：<span id="sync-time">載入中...</span>
        </div>
    </div>

    <div id="map"></div>
    
    <div class="legend">
        <b style="color: #333;">路況說明</b><br>
        <span style="color: #28a745;">●</span> 🟢 暢通 (0-40%)<br>
        <span style="color: #ffc107;">●</span> 🟡 車多 (40-70%)<br>
        <span style="color: #dc3545;">●</span> 🔴 壅塞 (70-100%)
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([22.193, 113.543], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let geojsonLayer = null;
        let currentHls = null;
        
        // 紀錄目前正在觀看的攝像頭名稱，如果不是 null，代表正在看影片
        let watchingCameraName = null; 

        async function fetchTraffic() {
            try {
                // ⚠️ 請確保此處為你正確的 API 網址
                const response = await fetch('/api/traffic');
                const data = await response.json();

                if (data.last_updated) {
                    document.getElementById('sync-time').innerText = data.last_updated;
                }

                // 🌟 核心修復：如果使用者正在看影片，我們只更新文字數據，絕不刪除圖層！
                if (watchingCameraName) {
                    const camData = data.features.find(f => f.properties.type === 'camera' && f.properties.name === watchingCameraName);
                    if (camData) {
                        const props = camData.properties;
                        const scorePercent = Math.round(props.score * 100);
                        
                        // 動態更新彈窗內的文字，不干擾影片播放
                        const statScore = document.getElementById('stat-score');
                        if (statScore) {
                            statScore.innerText = scorePercent + '%';
                            statScore.style.color = props.color;
                        }
                        const statVeh = document.getElementById('stat-veh');
                        if (statVeh) statVeh.innerText = props.veh_active + ' 台';
                        
                        const statFlow = document.getElementById('stat-flow');
                        if (statFlow) statFlow.innerText = props.flow_total + ' 輛/分';
                    }
                    // 結束這次更新，保留原本的地圖圖層與影片播放器
                    return; 
                }

                // 如果沒有在看影片，才正常重繪整個地圖圖層
                if (geojsonLayer) { map.removeLayer(geojsonLayer); }

                geojsonLayer = L.geoJSON(data, {
                    style: function(feature) {
                        if (feature.properties.type === 'street') {
                            return { color: feature.properties.color, weight: 5, opacity: 0.7, lineCap: 'round' };
                        }
                    },
                    pointToLayer: function(feature, latlng) {
                        if (feature.properties.type === 'camera') {
                            return L.circleMarker(latlng, {
                                radius: 7, fillColor: feature.properties.color, color: "#ffffff", weight: 2, fillOpacity: 1
                            });
                        }
                    },
                    onEachFeature: function(feature, layer) {
                        if (feature.properties.type === 'camera') {
                            const props = feature.properties;
                            const scorePercent = Math.round(props.score * 100);
                            
                            const videoUrl = props.stream_url || "";
                            const videoElement = videoUrl 
                                ? `<video class="camera-stream" data-name="${props.name}" data-url="${videoUrl}" width="100%" style="border-radius: 5px; background: #000; margin-bottom: 8px;" controls muted autoplay playsinline></video>`
                                : `<div style="padding: 10px; background: #eee; text-align: center; border-radius: 5px; margin-bottom: 8px; font-size: 12px; color: #666;">無影像來源</div>`;

                            const popupContent = `
                                <div style="font-family: sans-serif; padding: 5px; width: 280px;">
                                    <b style="font-size: 14px; color: #333;">${props.name}</b><br>
                                    <hr style="margin: 8px 0; border: 0; border-top: 1px solid #eee;">
                                    ${videoElement}
                                    <div style="font-size: 13px;">
                                        🚦 壅塞程度: <b id="stat-score" style="color:${props.color}">${scorePercent}%</b><br>
                                        🚗 即時車數: <b id="stat-veh">${props.veh_active} 台</b><br>
                                        📈 估算流量: <b id="stat-flow">${props.flow_total} 輛/分</b>
                                    </div>
                                </div>
                            `;
                            layer.bindPopup(popupContent, { maxWidth: 320 });
                        }
                    }
                }).addTo(map);
            } catch (error) { 
                console.error('無法抓取資料:', error);
                document.getElementById('sync-time').innerText = "連線失敗";
            }
        }

        // 監聽彈窗打開：啟動影片，並標記目前正在觀看
        map.on('popupopen', function(e) {
            const videoElement = document.querySelector('.camera-stream');
            if (!videoElement) return;

            watchingCameraName = videoElement.getAttribute('data-name');
            const streamUrl = videoElement.getAttribute('data-url');
            if (!streamUrl) return;

            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            if (Hls.isSupported()) {
                currentHls = new Hls({
                    lowLatencyMode: true, // 降低延遲
                });
                currentHls.loadSource(streamUrl);
                currentHls.attachMedia(videoElement);
                currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play().catch(e => console.log("播放被阻擋", e));
                });
                
                // 🌟 HLS 錯誤自動恢復機制
                currentHls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            console.log("網路錯誤，嘗試重新連線...");
                            currentHls.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            console.log("多媒體錯誤，嘗試恢復...");
                            currentHls.recoverMediaError();
                        } else {
                            currentHls.destroy();
                        }
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                videoElement.addEventListener('loadedmetadata', function() {
                    videoElement.play();
                });
            }
        });

        // 監聽彈窗關閉：釋放資源，解除鎖定，並立刻重繪一次地圖
        map.on('popupclose', function() {
            watchingCameraName = null;
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            fetchTraffic(); // 關閉影片後，立刻把地圖路況更新到最新
        });

        // 啟動與自動刷新
        fetchTraffic();
        setInterval(fetchTraffic, 5000); // 保持每 5 秒與後端同步
    </script>
</body>
</html>
